<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Bridge</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/mode.css">
  <link rel="stylesheet" href="/scrollbars.css">
  <link rel="stylesheet" href="/attachments.css">
  <link rel="stylesheet" href="/projects.css">
  <link rel="stylesheet" href="/thread-browser.css">
  <link rel="stylesheet" href="/mobile.css">
  <link rel="stylesheet" href="/feishu-auth.css">
  <link rel="stylesheet" href="/composer.css?v=20260820-2">
</head>
<body>
  <section id="auth-gate" class="auth-gate" hidden>
    <div class="auth-card">
      <div class="auth-logo">C</div>
      <h2>正在验证飞书身份</h2>
      <p id="auth-message">请在飞书客户端内打开此网页应用。</p>
      <button id="auth-retry" hidden>重新验证</button>
    </div>
  </section>
  <main class="shell">
    <dialog id="new-thread-dialog" class="new-thread-dialog">
      <form id="new-thread-form" method="dialog">
        <header><strong>新建对话</strong><button id="close-new-thread" type="button">×</button></header>
        <div class="new-thread-kinds">
          <label><input type="radio" name="thread-kind" value="existing" checked> 现有项目</label>
          <label><input type="radio" name="thread-kind" value="project"> 新建项目</label>
          <label><input type="radio" name="thread-kind" value="standalone"> 独立会话</label>
        </div>
        <label id="existing-project-row">项目<select id="new-thread-project"></select></label>
        <label id="new-project-row" hidden>项目名称<input id="new-project-name" maxlength="80" placeholder="例如：销售模型"></label>
        <label>对话名称<input id="new-thread-title" maxlength="100" required></label>
        <label>第一条消息<textarea id="new-thread-text" rows="4" required placeholder="输入这个对话要开始处理的内容"></textarea></label>
        <p id="new-thread-location" class="new-thread-location"></p>
        <footer><button id="cancel-new-thread" type="button">取消</button><button type="submit" class="primary">创建并发送</button></footer>
      </form>
    </dialog>
    <div id="thread-menu" class="thread-menu" hidden><button id="hide-thread" type="button">从网页列表移除</button><button id="cancel-thread-menu" type="button">取消</button></div>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <aside class="sidebar">
      <header class="brand">
        <div class="logo">C</div>
        <div><h1>Codex Bridge</h1><p>网页、飞书与 PC 统一协作</p></div>
      </header>
      <label class="search"><span>⌕</span><input id="search" placeholder="搜索对话或项目"></label>
      <div class="summary"><span id="count">0 个对话</span><span><button id="new-thread">新建</button><button id="refresh">刷新</button></span></div>
      <nav id="threads" class="threads"></nav>
      <button id="load-more" class="load-more" hidden>查看更早对话</button>
    </aside>
    <section class="conversation">
      <header class="conversation-head">
        <button id="menu" class="menu-button" aria-label="打开对话列表">对话</button>
        <div class="conversation-title"><h2 id="title">选择一个对话</h2><p id="meta">从左侧查看 Codex 历史</p></div>
        <div class="head-actions"><div class="quota-wrap"><button id="quota" class="quota" type="button"><span>额度</span><strong>读取中</strong><div><i></i></div></button><div id="quota-details" class="quota-details" hidden></div></div><div id="mode" class="mode detecting">正在检测模式</div><div class="readonly">可输入</div></div>
      </header>
      <div id="messages" class="messages">
        <div class="empty"><div class="empty-icon">↖</div><h3>选择一个对话开始工作</h3><p>网页任务默认只在网页显示；运行中继续发送会作为补充引导。</p></div>
      </div>
      <section id="task-strip" class="task-strip" hidden></section>
      <form id="composer" class="composer">
        <label class="file-button" title="上传图片或轻量文档">＋<input id="files" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.bmp,.pdf,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx,.txt,.md"></label>
        <textarea id="prompt" rows="1" aria-label="输入发送给 Codex 的内容"></textarea>
        <button id="send" type="submit">发送</button>
      </form>
      <div id="file-list" class="file-list" hidden></div>
    </section>
  </main>
  <script src="https://lf-scm-cn.feishucdn.com/lark/op/h5-js-sdk-1.5.44.js"></script>
  <script src="/app.js?v=20260821-3"></script>
</body>
</html>
